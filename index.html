
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Discover anime events, connect with fans, and explore your anime community with CloudAnime. Available now on iOS and Android.">

  <title>CloudAnime | Download Now</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
      padding: 2rem;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #f95;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #ddd;
      max-width: 550px;
      line-height: 1.6;
    }

    .downloads {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .button {
      display: inline-block;
      padding: 1rem 2rem;
      background-color: #f95;
      color: #111;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.2s;
    }

    .button:hover {
      background-color: #ffb477;
      transform: translateY(-2px);
    }

    .discord {
      margin-top: 2.5rem;
      font-size: 0.95rem;
      color: #bbb;
      line-height: 1.8;
    }

    .discord a {
      color: #f95;
      text-decoration: none;
      font-weight: bold;
    }

    .discord a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }

      .downloads {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }

      .button {
        display: block;
      }
    }
  </style>
</head>

<body>
  <h1>🎉 CloudAnime is Live! 🎉</h1>

  <p>
    Discover anime conventions, parties, and events near you.
    Connect with fellow anime fans and never miss out on
    what's happening in your community!
  </p>

  <div class="downloads">
    <a
      href="https://apps.apple.com/us/app/cloudanime/id6483004308"
      class="button"
      target="_blank"
      rel="noopener noreferrer"
    >
      🍎 Download for iOS
    </a>

    <a
      href="https://play.google.com/store/apps/details?id=com.cloudanime"
      class="button"
      target="_blank"
      rel="noopener noreferrer"
    >
      ▶ Download for Android
    </a>
  </div>

  <div class="discord">
    Want to connect with the community?
    <div>
      <a
        href="https://discord.gg/nqxTXXpCUF"
        target="_blank"
        rel="noopener noreferrer"
      >
        Join our Discord
      </a>
    </div>
  </div>
</body>
</html>
